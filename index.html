<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        yle>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #333;
            padding: 10px;
            text-align: left;
        }
        thead {
            background-color: #4CAF50;
            color: white;
        }
        tfoot {
            background-color: #ddd;
            font-weight: bold;
        }
        .text-right {
            text-align: right;
        }
    </style>
</head>
<body>
    <h2>Data Gaji Pegawai</h2>
    <div id="tabell"></div>
    <script>
        let namapegawai = "Dodi Prayodi";
        let umur = 25;
        let jabatan = "manajer";
        let status = "menikah";
        let gapok = 0;
        if (jabatan === "manajer"){
            gapok = 15000000;
        } else if (jabatan === "asisten manajer"){
            gapok = 10000000;
        }else if (jabatan === "staff"){
            gapok = 5000000;
        }
        let tunjanganjabatan = 0.15 * gapok;
        let bpjs = 0.10 * gapok;
        let tunjanganKeluarga = (status === "menikah") ? (0.20 * gapok) : 0;
        let totalgaji = gapok + tunjanganjabatan + tunjanganKeluarga - bpjs;
            let tabelHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Nama Pegawai</th>
                        <th>Umur</th>
                        <th>Jabatan</th>
                        <th>Status</th>
                        <th>Gaji Pokok</th>
                        <th>Tunj. Jabatan (15%)</th>
                        <th>BPJS (10%)</th>
                        <th>Tunj. Keluarga (20%)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>${namapegawai}</td>
                        <td>${umur} Tahun</td>
                        <td style="text-transform: capitalize;">${jabatan}</td>
                        <td style="text-transform: capitalize;">${status}</td>
                        <td class="text-right">${gapok}</td>
                        <td class="text-right">${tunjanganjabatan}</td>
                        <td class="text-right">${bpjs}</td>
                        <td class="text-right">${tunjanganKeluarga}</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="7" class="text-right"><strong>TOTAL GAJI BERSIH</strong></td>
                        <td class="text-right"><strong>${totalgaji}</strong></td>
                    </tr>
                </tfoot>
            </table>
        `;
        document.getElementById("tabell").innerHTML = tabelHTML;
    </script>
</body>
</html>
